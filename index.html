<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>City of Seat Pleasant — Winter Wonderland Santa Run Tracker</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #040d1a;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #f8fafc;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #061326;
    }

    /* Keyless Midnight Ice Filter applied ONLY to the map background tiles */
    .leaflet-tile-pane.theme-osm-ice {
      filter: invert(100%) hue-rotate(195deg) brightness(93%) contrast(96%) saturate(150%);
    }
    .leaflet-tile-pane.theme-esri-dark {
      filter: hue-rotate(10deg) saturate(130%) brightness(105%);
    }

    /* Snowfall Canvas Overlay */
    #snow-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 400;
    }

    /* Holiday Display Font */
    .font-holiday {
      font-family: 'Mountains of Christmas', cursive;
    }

    /* SPPD Emergency Lightbar Animation on Santa Marker */
    @keyframes strobeRed {
      0%, 49% { background: #ef4444; box-shadow: 0 0 16px 6px rgba(239, 68, 68, 0.95); }
      50%, 100% { background: #450a0a; box-shadow: none; }
    }
    @keyframes strobeBlue {
      0%, 49% { background: #1e3a8a; box-shadow: none; }
      50%, 100% { background: #3b82f6; box-shadow: 0 0 16px 6px rgba(59, 130, 246, 0.95); }
    }
    @keyframes sleighFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .sppd-strobe-red {
      animation: strobeRed 0.45s infinite;
    }
    .sppd-strobe-blue {
      animation: strobeBlue 0.45s infinite;
    }
    .sleigh-float {
      animation: sleighFloat 2.2s ease-in-out infinite;
    }

    /* Custom Leaflet Dark Frost Popups */
    .leaflet-popup-content-wrapper {
      background: rgba(10, 25, 47, 0.95) !important;
      color: #f8fafc !important;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 14px !important;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.65) !important;
      backdrop-filter: blur(10px);
    }
    .leaflet-popup-tip {
      background: rgba(10, 25, 47, 0.95) !important;
    }
  </style>
</head>
<body class="relative select-none">

  <!-- Interactive Map Container -->
  <div id="map"></div>

  <!-- Falling Snow Canvas -->
  <canvas id="snow-canvas"></canvas>

  <!-- TOP OVERLAY: Header, Countdown & Controls -->
  <div class="absolute top-3 left-3 right-3 z-[500] pointer-events-none flex flex-col gap-2 max-w-6xl mx-auto">
    <div class="pointer-events-auto bg-slate-950/85 backdrop-blur-md border border-sky-400/30 rounded-2xl px-4 py-3 shadow-2xl flex flex-wrap items-center justify-between gap-3">
      
      <!-- Brand / Title -->
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-red-600 via-red-700 to-blue-900 p-0.5 shadow-lg flex items-center justify-center border border-amber-300/50">
          <span class="text-2xl" title="Seat Pleasant Santa Run">🎅</span>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-[11px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded-full bg-blue-600/30 text-sky-300 border border-sky-400/30">
              City of Seat Pleasant &bull; SPPD
            </span>
            <span id="gps-badge" class="text-[11px] font-bold uppercase px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-400/30 flex items-center gap-1">
              <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
               Standby Mode
            </span>
          </div>
          <h1 class="font-holiday text-2xl sm:text-3xl text-white tracking-wide leading-tight">
            Winter Wonderland Santa Run Tracker
          </h1>
        </div>
      </div>

      <!-- Event Countdown Timer (Dec 22, 2026 @ 6:00 PM) -->
      <div class="flex items-center
