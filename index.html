<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>City of Seat Pleasant — Winter Wonderland Santa Run Tracker</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #040d1a;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #f8fafc;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #07162c;
    }

    /* 1. Winter Wonderland Frosted Map Filter */
    .leaflet-tile-pane.theme-winter-wonderland {
      filter: invert(100%) hue-rotate(192deg) brightness(102%) contrast(92%) saturate(165%);
    }

    /* 2. Icy Frosted Border Vignette around the entire map */
    #frost-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 390;
      box-shadow:
        inset 0 0 75px rgba(186, 230, 253, 0.35),
        inset 0 0 22px rgba(255, 255, 255, 0.45);
      border: 3px solid rgba(224, 242, 254, 0.35);
    }

    /* 3. Snowfall Canvas Overlay */
    #snow-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 400;
    }

    .font-holiday {
      font-family: 'Mountains of Christmas', cursive;
    }

    /* 4. Animated Candy-Cane Snow Route */
    @keyframes candyCaneMarch {
      to {
        stroke-dashoffset: -48;
      }
    }
    .candy-cane-line {
      animation: candyCaneMarch 1.2s linear infinite;
    }

    /* 5. Twinkling Holiday Street Lights along the actual streets */
    @keyframes twinkleBulb {
      0%, 100% { transform: scale(0.8); opacity: 0.55; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    .holiday-bulb {
      width: 9px;
      height: 9px;
      border-radius: 9999px;
      animation: twinkleBulb 1.5s ease-in-out infinite;
    }

    /* 6. Floating Winter Village Props */
    @keyframes propSway {
      0%, 100% { transform: translateY(0px) rotate(-2deg); }
      50% { transform: translateY(-3px) rotate(2deg); }
    }
    .winter-prop {
      animation: propSway 3.2s ease-in-out infinite;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.55));
    }

    /* 7. SPPD Emergency Lightbar & Sleigh Animation */
    @keyframes strobeRed {
      0%, 49% { background: #ef4444; box-shadow: 0 0 16px 6px rgba(239, 68, 68, 0.95); }
      50%, 100% { background: #450a0a; box-shadow: none; }
    }
    @keyframes strobeBlue {
      0%, 49% { background: #1e3a8a; box-shadow: none; }
      50%, 100% { background: #3b82f6; box-shadow: 0 0 16px 6px rgba(59, 130, 246, 0.95); }
    }
    @keyframes sleighFloat {
      0%, 100% { transform: translateY(0px); }
